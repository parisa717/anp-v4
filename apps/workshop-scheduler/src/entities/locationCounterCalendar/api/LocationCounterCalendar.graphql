query GetLocationCounterCalendar($locationId: UUID!) {
  getLocationCounterCalendar(locationId: $locationId) {
    workDays {
      dayNumber
      startTime
      endTime
      breaks {
        startTime
        endTime
      }
    }
  }
}

mutation UpdateLocationCounterCalendar(
  $locationId: UUID!
  $workDays: [GqlUpdateLocationCounterCalendarWorkdayInputType!]!
) {
  updateLocationCounterCalendar(locationId: $locationId, workDays: $workDays) {
    status
  }
}
