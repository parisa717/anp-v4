query GetAvailabilityColors {
  getAvailabilityColors {
    availabilityColors {
      id
      color
      minimalCapacity
      maximalCapacity
    }
  }
}

mutation UpdateAvailabilityColors($availabilityColors: [GqlUpdateAvailabilityColorInputType!]!) {
  updateAvailabilityColors(availabilityColors: $availabilityColors) {
    status
  }
}
