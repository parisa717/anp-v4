mutation CreateLocation($location: GqlCreateLocationInputType!) {
  createLocation(location: $location) {
    id
  }
}
query GetLocations {
  getLocations {
    locations {
      id
      code
      name
      isActive
      address {
        country {
          id
          name
        }
        postCode
        city
        address
      }
      area {
        id
        code
        name
      }
      brands {
        id
        code
        isWorkshopDefault
      }
    }
  }
}
