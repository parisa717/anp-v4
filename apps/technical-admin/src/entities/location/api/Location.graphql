mutation CreateLocation($location: GqlCreateLocationInputType!) {
  createLocation(location: $location) {
    id
  }
}
query GetLocation($id: ID!) {
  getLocation(id: $id) {
  
      id
      code
      name
      isActive
      address {
        country {
          id
          name
        }
        postCode
        city
        address
      }
      area {
        id
        code
        name
      }
      brands {
        id
        code
        isWorkshopDefault
      }
    
  }
}
